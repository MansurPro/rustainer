name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # RND.md section 18.3 and 15.8: "no async runtime near clone3" must be a
      # build failure, not a review rule. Threads cannot be un-spawned,
      # several namespace operations require a single-threaded caller, and a
      # crate can introduce an executor transitively - the obvious cgroups
      # crate does exactly this, pulling in a D-Bus client whose default
      # features include a blocking thread pool. A current-thread runtime does
      # not save you either.
      #
      # `cargo tree -i <pkg>` exits non-zero when the package is absent from
      # the graph, so success here is the failure condition.
      - name: rustainer-core must never link an async runtime
        run: |
          for rt in tokio async-std smol; do
            if cargo tree -p rustainer-core -i "$rt" 2>/dev/null; then
              echo "::error::rustainer-core depends on $rt. The process that calls clone3 must be single-threaded (RND.md 18.3)."
              exit 1
            fi
          done
          echo "no executor in the core dependency graph"

  stages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # CLONE_NEWPID needs CAP_SYS_ADMIN. Every assertion in this script reads
      # kernel state back from inside the container rather than checking that
      # a command printed the right thing.
      - run: cargo build --release
      - name: Stage 1 success test
        run: sudo RUSTAINER_BIN="$PWD/target/release/rustainer" bash scripts/stage1-success-test.sh
      - name: Stage 2 success test
        run: sudo RUSTAINER_BIN="$PWD/target/release/rustainer" bash scripts/stage2-success-test.sh
      - name: Stage 3 success test
        run: sudo RUSTAINER_BIN="$PWD/target/release/rustainer" bash scripts/stage3-success-test.sh
      - name: Stage 5 success test
        run: sudo RUSTAINER_BIN="$PWD/target/release/rustainer" bash scripts/stage5-success-test.sh
      # In a delegated scope, so the resource stage exercises real limits
      # rather than only the refusal path, and so it never touches the
      # runner's own cgroup.
      - name: Stage 4 success test
        run: |
          sudo systemd-run --scope -p Delegate=yes -q \
            env RUSTAINER_BIN="$PWD/target/release/rustainer" \
            bash scripts/stage4-success-test.sh
      # The same stages with no root at all, in a user namespace. This is not
      # redundant: it takes the rootless code paths - device nodes bound
      # instead of mknod'd, /sys bound instead of mounted - and it is the
      # standing check that the privilege seam of RND.md 18.6 still holds.
      - name: Stages 1-5, unprivileged
        run: |
          # Ubuntu 24.04 ships an AppArmor brake on unprivileged user
          # namespaces, so `unshare -U` fails with "write failed
          # /proc/self/uid_map: Operation not permitted". Lift it rather than
          # skip the job: a silently skipped test is the kind of lie this
          # project is built not to tell, and the rootless paths are exactly
          # the ones nothing else here covers.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user true || {
            echo "::error::unprivileged user namespaces are unavailable on this runner"
            exit 1
          }
          for s in 1 2 3 4 5; do
            systemd-run --user --scope -p Delegate=yes -q \
              unshare --user --map-root-user \
              env RUSTAINER_BIN="$PWD/target/release/rustainer" \
              bash "scripts/stage${s}-success-test.sh" \
            || unshare --user --map-root-user \
              env RUSTAINER_BIN="$PWD/target/release/rustainer" \
              bash "scripts/stage${s}-success-test.sh"
          done
